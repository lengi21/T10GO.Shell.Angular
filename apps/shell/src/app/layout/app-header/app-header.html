<header class="app-header">
  <div class="app-header__brand">
    <div class="app-header__logo">
      T10GO
    </div>
  </div>

  <div class="app-header__actions">
    <t10go-context-menu #userMenu>
    <button
      t10goContextMenuTrigger
      type="button"
      class="app-header__user"
      aria-label="Open user menu"
      [attr.aria-expanded]="userMenu.isOpen()"
    >
      <span class="app-header__avatar">
        U
      </span>

      <span class="app-header__user-info">
        <span class="app-header__user-name">
          User
        </span>

        <span class="app-header__user-email">
          userexample.com
        </span>
      </span>

      <span
        class="app-header__chevron"
        aria-hidden="true"
      >
        ▾
      </span>
    </button>
    <div t10goContextMenuContent class="app-header__menu" aria-label="User preferences">
      <t10go-swatch-dropdown
        label="Palette"
        [value]="themeService.palette()"
        [options]="paletteOptions"
        (valueChange)="setPalette($event)"
      />
      <t10go-dropdown
        label="Theme"
        [value]="themeService.theme()"
        [options]="themeOptions"
        (valueChange)="setTheme($event)"
      />

      <a class="app-header__menu-link" routerLink="/settings" (click)="userMenu.close()">
        <span class="material-icons md-24" aria-hidden="true">settings</span>
        Settings
      </a>
    </div>
    </t10go-context-menu>
  </div>
</header>

<nav
  class="app-sidebar__navigation"
  aria-label="Main navigation"
>
  @for (
    item of navigationItems;
    track item.id
    ) {
    <div class="navigation-item">

      <div class="navigation-item__row">

        @if (item.icon) {
          <mat-icon
            class="navigation-item__icon"
            [svgIcon]="'t10go-' + item.icon"
            aria-hidden="true"
          />
        }

        @if (item.route) {
          <a
            class="navigation-item__link"
            [routerLink]="item.route"
          >
        <span class="navigation-item__label">
          {{ item.label }}
        </span>
          </a>
        } @else {
          <span class="navigation-item__label">
        {{ item.label }}
      </span>
        }

      </div>

      @if (item.children?.length) {
        <div class="navigation-item__children">
          @for (
            child of item.children;
            track child.id
            ) {
            <app-sidebar-item
              [item]="child"
            />
          }
        </div>
      }

    </div>

  }
</nav>
